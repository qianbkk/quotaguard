[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quotaguard"
version = "0.1.0"
description = "Run long-running AI agents against MiniMax's 5h quota, hands-off. Auto-pause when low, auto-resume when the window rolls over."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["minimax", "llm", "quota", "monitor", "claude-code", "agent", "rate-limit"]
authors = [{ name = "QuotaGuard Contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
proxy = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]
dev = [
    "pytest>=7",
    "pytest-timeout>=2",
]

[project.urls]
Homepage = "https://github.com/qianbkk/quotaguard"
Issues = "https://github.com/qianbkk/quotaguard/issues"
Source = "https://github.com/qianbkk/quotaguard"

[project.scripts]
quota-guard = "quota_guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quota_guard*"]

[tool.setuptools.package-data]
quota_guard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
timeout = 60
